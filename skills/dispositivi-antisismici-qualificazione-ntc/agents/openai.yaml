display_name: "Dispositivi antisismici: qualificazione e accettazione (NTC 2018 par. 11.9)"
short_description: Supporto documentale al progettista strutturale, al Direttore dei Lavori e al collaudatore per la qualificazione e i controlli di accettazione in cantiere dei dispositivi antisismici e di controllo delle vibrazioni (isolatori elastomerici e a scorrimento, dissipatori lineari, non lineari e viscosi, dispositivi di vincolo a fusibile e provvisori) secondo le NTC 2018 (D.M. 17 gennaio 2018), paragrafo 11.9. Aiuta a inquadrare i requisiti generali (vita di servizio superiore a 10 anni; campo di temperatura di riferimento, in assenza di indicazioni almeno da -15 a +45 gradi; piani di manutenzione e sostituzione; nella UNI EN 15129 dbd come spostamento allo SLV e gamma_x per dbd allo SLC); le tipologie del par. 11.9.1; la procedura di qualificazione del par. 11.9.2 (per i dispositivi del punto A del par. 11.1 conformita' alla UNI EN 15129 e Marcatura CE con sistema di valutazione e verifica della costanza della prestazione per applicazioni critiche; altrimenti caso C del par. 11.1; manuale di posa e manutenzione con ogni fornitura); la procedura di accettazione del par. 11.9.3 (obbligatoria per tutte le tipologie e demandata al Direttore dei Lavori, che campiona i dispositivi sui lotti destinati allo specifico cantiere, verifica la documentazione e le tolleranze e rifiuta le forniture non conformi; prove eseguite e certificate da un laboratorio ex art. 59 del DPR 380/2001); e le prove di accettazione e i limiti prestazionali per tipo dei par. 11.9.4-11.9.10 (almeno il 20 per cento dei dispositivi e comunque non meno di 4; tabelle 11.9.I-IV; prova quasi statica con almeno 5 cicli ad ampiezza piu o meno d2; per i viscosi il fattore di affidabilita' gamma_v; per gli isolatori a scorrimento la variazione dell'attrito entro il 25 per cento). NON esegue il progetto delle costruzioni con isolamento o dissipazione ne' dimensiona i dispositivi (par. 7.10) e non sostituisce il progettista, il Direttore dei Lavori ne' il laboratorio. E' distinta dalla skill sul progetto delle costruzioni isolate (par. 7.10), che rinvia al par. 11.9.
default_prompt: |
  Devo gestire l'accettazione in cantiere di isolatori/dissipatori antisismici per un edificio secondo le NTC 2018
  (par. 11.9). Quali requisiti generali (vita di servizio, temperatura) e quale percorso di qualificazione si
  applicano (UNI EN 15129 + Marcatura CE oppure caso C del par. 11.1)? Chi effettua i controlli di accettazione e
  come si campionano i dispositivi? Su quanti dispositivi vanno fatte le prove (almeno 20% e non meno di 4) e quali
  limiti prestazionali valgono per tipo (Tab. 11.9.I-IV, prova quasi statica ± d2)? Cita i paragrafi.
