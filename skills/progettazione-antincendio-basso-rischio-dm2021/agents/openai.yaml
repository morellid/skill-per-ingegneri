display_name: "Progettazione antincendio luoghi di lavoro a basso rischio (D.M. 3/9/2021)"
short_description: Supporto documentale per la progettazione, realizzazione ed esercizio della sicurezza antincendio nei luoghi di lavoro secondo il D.M. 3 settembre 2021 (attuativo dell'art. 46 comma 3 lettera a) punti 1 e 2 del D.Lgs 81/2008, in vigore dal 29 ottobre 2022, sostituisce il D.M. 10 marzo 1998). Aiuta RSPP, progettista antincendio e datore di lavoro a inquadrare la valutazione del rischio di incendio come parte specifica del documento di valutazione dei rischi DVR (art. 2); a stabilire quale corpo di regole si applica (art. 3, cioe' la regola tecnica verticale se applicabile, l'Allegato I ovvero il minicodice per i luoghi a basso rischio, oppure il Codice di prevenzione incendi D.M. 3 agosto 2015 negli altri casi); a verificare i requisiti di basso rischio (attivita' non soggetta ai controlli dei vigili del fuoco e priva di regola tecnica verticale, con affollamento complessivo minore o uguale a 100 occupanti, superficie lorda minore o uguale a 1000 metri quadri, piani a quota compresa tra -5 e 24 metri, assenza di materiali combustibili, sostanze o miscele pericolose e lavorazioni pericolose in quantita' significative); e ad applicare la strategia antincendio dell'Allegato I (compartimentazione; esodo con almeno due vie indipendenti, corridoio cieco fino a 30 o 45 metri, lunghezza d'esodo fino a 60 metri, larghezze minime dei percorsi, densita' di affollamento 0,7 persone per metro quadro; gestione della sicurezza antincendio GSA; controllo dell'incendio con estintori di capacita' almeno 13A e carica almeno 6 kg o 6 litri a distanza massima 30 metri ed eventuali reti idranti; rivelazione e allarme con IRAI; controllo di fumi e calore; operativita' antincendio con avvicinamento dei mezzi di soccorso a distanza minore o uguale a 50 metri; sicurezza degli impianti tecnologici e di servizio). NON progetta o dimensiona le misure al posto del tecnico, non riproduce il Codice di prevenzione incendi (D.M. 3 agosto 2015) ne' le norme UNI citate e non sostituisce il professionista antincendio. E' il terzo dei tre decreti antincendio del settembre 2021 ed e' distinta dalle skill sulla gestione dell'emergenza (D.M. 2 settembre 2021) e sul controllo e la manutenzione dei sistemi (D.M. 1 settembre 2021).
default_prompt: |
  Devo impostare la sicurezza antincendio di un luogo di lavoro secondo il D.M. 3 settembre 2021. Come inquadro la
  valutazione del rischio di incendio nel DVR? Quale corpo di regole si applica: regola tecnica verticale, minicodice
  (Allegato I) o Codice di prevenzione incendi? Quali sono i requisiti perché il luogo sia a basso rischio? E quali sono
  le misure minime della strategia antincendio (esodo, compartimentazione, estintori, GSA, operatività)? Cita gli
  articoli e i punti dell'Allegato I.
