# Fonte normativa per la progettazione sismica delle costruzioni di
# calcestruzzo armato (tipologie strutturali, fattori di comportamento,
# gerarchia delle resistenze e dettagli costruttivi CD"A"/CD"B") secondo le
# NTC 2018 (DM 17/01/2018), par. 7.4 (Cap. 7). La skill inquadra il quadro
# progettuale sismico del c.a.; non esegue il progetto ne' le verifiche di
# dettaglio.

