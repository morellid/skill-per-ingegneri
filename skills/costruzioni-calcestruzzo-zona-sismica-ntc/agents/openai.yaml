display_name: "Costruzioni di calcestruzzo in zona sismica (NTC 2018 par. 7.4)"
short_description: Supporto documentale al progettista strutturale per inquadrare la progettazione sismica delle costruzioni di calcestruzzo armato secondo le NTC 2018 (D.M. 17 gennaio 2018), paragrafo 7.4. Aiuta a inquadrare le caratteristiche dei materiali del par. 7.4.2 (acciaio B450C; B450A ammesso solo con diametri tra 5 e 10 mm per reti e tralicci, o come armatura trasversale se la plasticizzazione e' impedita dalla gerarchia delle resistenze, negli elementi secondari o nelle strutture non dissipative); le tipologie strutturali del par. 7.4.3.1 (a telaio con taglio alla base almeno il 65%, a pareti semplici o composte e singole o accoppiate, miste telaio-pareti equivalenti a telai se oltre il 50% dell'azione orizzontale e' ai telai, a pendolo inverso, a pendolo inverso intelaiate monopiano con forza assiale non oltre il 30% della resistenza del calcestruzzo, deformabili torsionalmente con r2/ls2 almeno 1, a pareti estese debolmente armate con periodo non superiore a TC); i fattori di comportamento del par. 7.4.3.2 (q secondo il par. 7.3.1 e la tabella 7.3.II; pareti accoppiate se il momento alla base e' equilibrato per almeno il 20% dalla coppia degli sforzi verticali; alpha_u/alpha_1 pari a 1,1, 1,2 e 1,3 per i telai e 1,0, 1,1 e 1,2 per le pareti; scelta della classe di duttilita' CD A o CD B); e la gerarchia delle resistenze del par. 7.4.4 (fattori di sovraresistenza gamma_Rd della Tab. 7.2.I; taglio delle travi dalla capacita' flessionale amplificata; pilastri con domanda a compressione non oltre il 55% in CD A e il 65% in CD B della capacita' del solo calcestruzzo; nodo pilastro forte-trave debole con somma dei momenti resistenti dei pilastri maggiore o uguale a gamma_Rd per la somma di quelli delle travi). NON esegue il progetto ne' le verifiche di dettaglio (par. 7.4.6) e non sostituisce il progettista ne' la Circolare 2019. E' distinta dalla skill sul progetto ordinario non sismico del calcestruzzo (par. 4.1) e da quella sul fattore di comportamento q (par. 7.3.1).
default_prompt: |
  Devo impostare la progettazione sismica di un edificio in c.a. a telaio secondo le NTC 2018 (par. 7.4). Come
  classifico la tipologia strutturale (criterio del taglio alla base) e quale valore di alpha_u/alpha_1 uso? Quando
  devo progettare in CD"A" e quando in CD"B"? Come applico la gerarchia delle resistenze: come ricavo il taglio di
  progetto delle travi, quale limite di compressione vale per i pilastri (55%/65%) e come verifico il nodo
  trave-pilastro (pilastro forte-trave debole, ΣMc,Rd ≥ γRd·ΣMb,Rd)? Cita i paragrafi.
