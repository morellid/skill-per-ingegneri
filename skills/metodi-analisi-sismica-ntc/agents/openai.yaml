display_name: "Metodi di analisi sismica (NTC 2018 par. 7.3.2-7.3.4)"
short_description: Supporto documentale al progettista strutturale per la scelta e l'impostazione del metodo di analisi sismica secondo le NTC 2018 (D.M. 17 gennaio 2018), paragrafi 7.3.2, 7.3.3 e 7.3.4. Aiuta a inquadrare la scelta tra analisi dinamica e statica del par. 7.3.2 (il metodo di riferimento e' l'analisi modale con spettro di risposta, ossia l'analisi lineare dinamica; l'analisi lineare statica con il metodo delle forze laterali e' ammessa solo se la risposta non dipende significativamente dai modi superiori; in alternativa analisi non lineare dinamica o statica); l'analisi lineare dinamica del par. 7.3.3.1 (considerare tutti i modi con massa partecipante superiore al 5 per cento e un numero di modi con massa totale superiore all'85 per cento, con combinazione quadratica completa CQC e eccentricita' accidentale del centro di massa); l'analisi lineare statica del par. 7.3.3.2 (applicabile se il periodo T1 non supera 2,5 volte TC o TD e la costruzione e' regolare in altezza; forze Fh = Sd(T1) W lambda/g e Fi = Fh zi Wi diviso la somma di zj Wj, con lambda pari a 0,85 se T1 e' minore di 2 TC e ci sono almeno tre orizzontamenti, altrimenti 1,0); la valutazione degli spostamenti del par. 7.3.3.3 (dE uguale a mu_d per dEe, con mu_d pari a q oppure 1+(q-1)TC/T1 e comunque non oltre 5q-4; spostamenti allo SLC pari a 1,25 volte quelli allo SLV); e l'analisi non lineare del par. 7.3.4 (dinamica con integrazione al passo; statica pushover con curva di capacita' Fb-dc, punto di controllo al centro di massa dell'ultimo livello e almeno due distribuzioni di forze, principali del Gruppo 1 con modo fondamentale non inferiore al 75 per cento o distribuzione modale obbligatoria se T1 supera 1,3 TC, e secondarie del Gruppo 2 uniforme, adattiva o multimodale con almeno sei modi). NON esegue l'analisi ne' le verifiche e non sostituisce il progettista ne' la Circolare 2019. E' distinta dalle skill sul fattore di comportamento q (par. 7.3.1), sul periodo T1 (par. 7.3.3.2), sui criteri di modellazione (par. 7.2.6) e sulla combinazione delle componenti (par. 7.3.5).
default_prompt: |
  Devo scegliere il metodo di analisi sismica per un edificio secondo le NTC 2018 (par. 7.3.2-7.3.4). Posso usare
  l'analisi lineare statica (forze laterali) o devo usare l'analisi modale? Quali condizioni di applicabilita' valgono
  (T1 rispetto a 2,5 TC, regolarita' in altezza)? Come calcolo le forze Fh e Fi e il coefficiente lambda? Se uso la
  pushover, quali distribuzioni di forze devo considerare (Gruppo 1 e Gruppo 2) e quando la distribuzione modale e'
  obbligatoria? Cita i paragrafi.
