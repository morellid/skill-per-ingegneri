display_name: "Controllo e manutenzione antincendio (D.M. 1 settembre 2021)"
short_description: Supporto documentale per il controllo e la manutenzione degli impianti, attrezzature ed altri sistemi di sicurezza antincendio nei luoghi di lavoro secondo il D.M. 1 settembre 2021 (attuativo dell'art. 46 comma 3 lettera a) punto 3 del D.Lgs 81/2008, in vigore dal 25 settembre 2022). Aiuta RSPP, datore di lavoro, tecnico antincendio e manutentore a distinguere i tre livelli di attivita' (sorveglianza, controllo periodico, manutenzione secondo le definizioni dell'art. 1); a impostare e tenere il registro dei controlli antincendio predisposto dal datore di lavoro (Allegato I), con le cadenze tratte dalle norme e specifiche tecniche pertinenti e dal manuale d'uso e manutenzione, mantenuto aggiornato e disponibile per gli organi di controllo; a individuare la norma tecnica di riferimento per tipologia di impianto tramite la Tabella 1 dell'Allegato I (per esempio estintori UNI 9994-1, reti di idranti UNI 10779 o UNI EN 671-3 o UNI EN 12845, impianti sprinkler UNI EN 12845, impianti di rivelazione e allarme incendio IRAI UNI 11224, sistemi di allarme vocale EVAC UNI ISO 7240-19 o UNI CEN/TS 54-32, evacuatori di fumo e calore UNI 9494-3); e a verificare che manutenzione e controllo periodico siano eseguiti da tecnici manutentori qualificati (art. 4 e Allegato II: percorso di formazione, valutazione dei requisiti, attestazione rilasciata dal Corpo nazionale dei vigili del fuoco, qualifica valida su tutto il territorio nazionale, regime transitorio per chi svolge attivita' di manutenzione da almeno 3 anni alla data di entrata in vigore). NON fissa le periodicita' puntuali dei controlli (che discendono dalle norme UNI di prodotto), non certifica il registro e non rilascia la qualifica dei manutentori. E' distinta dalle skill sulla gestione dell'emergenza (D.M. 2 settembre 2021), sui procedimenti di prevenzione incendi (DPR 151/2011) e sul carico d'incendio (D.M. 9 marzo 2007).
default_prompt: |
  Devo organizzare il controllo e la manutenzione dei sistemi di sicurezza antincendio della mia attività secondo il
  D.M. 1 settembre 2021. Qual è la differenza tra sorveglianza, controllo periodico e manutenzione, e chi può farli?
  Come imposto il registro dei controlli e chi lo predispone? Quale norma UNI è di riferimento per estintori, idranti e
  impianto di rivelazione (Tabella 1)? Chi deve essere un tecnico manutentore qualificato e come si ottiene la
  qualifica? Cita gli articoli e gli Allegati I e II.
