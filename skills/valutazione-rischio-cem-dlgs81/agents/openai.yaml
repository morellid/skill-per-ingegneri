display_name: "Rischio campi elettromagnetici (CEM) - D.Lgs 81/2008 Titolo VIII Capo IV"
short_description: Supporto documentale per la valutazione del rischio da esposizione dei lavoratori ai campi elettromagnetici (CEM) ai sensi del D.Lgs 81/2008, Titolo VIII Capo IV (artt. 206-212 e Allegato XXXVI). Aiuta RSPP, datore di lavoro e tecnico competente in agenti fisici a inquadrare la valutazione del rischio CEM nell'ambito del documento di valutazione dei rischi e a stabilire quando la misura o il calcolo dei livelli sono necessari e quando no (art. 209, con i casi dei luoghi accessibili al pubblico gia' valutati per la popolazione e delle attrezzature conformi a norme di prodotto); a distinguere gli effetti biofisici diretti (termici e non termici) dagli effetti indiretti (interferenza con dispositivi medici e stimolatori cardiaci, propulsione di oggetti ferromagnetici, innesco di detonatori, incendi ed esplosioni, correnti di contatto) ai sensi dell'art. 207; a usare il quadro dei valori limite di esposizione VLE (relativi agli effetti sanitari e agli effetti sensoriali) e dei valori di azione VA (inferiori e superiori) rinviando all'Allegato XXXVI parti I, II e III (art. 208); a impostare le misure per eliminare o ridurre il rischio quando i valori di azione sono superati (programma d'azione, schermature, limitazione di durata e intensita', dispositivi di protezione individuale, segnaletica e accesso limitato alle aree oltre i VA) ai sensi dell'art. 210; e a gestire i gruppi particolarmente sensibili (portatori di dispositivi medici impiantati e lavoratrici in gravidanza), l'informazione e la formazione (art. 210-bis), la sorveglianza sanitaria periodica (art. 211) e le deroghe ministeriali ai VLE (art. 212, Decreto Interministeriale 30 settembre 2022). NON riproduce i valori numerici VLE/VA dell'Allegato XXXVI, non esegue misure strumentali e non sostituisce il tecnico competente in agenti fisici ne' il medico competente. E' distinta dalle skill sul rumore (Capo II) e sulle vibrazioni (Capo III) e da quelle sull'esposizione della popolazione ai campi elettromagnetici (elettrodotti DPCM 2003, stazioni radio base art. 87 CCE).
default_prompt: |
  Devo impostare la valutazione del rischio da campi elettromagnetici in un luogo di lavoro (es. officina con saldatura
  e riscaldamento a induzione) secondo il D.Lgs 81/2008, Titolo VIII Capo IV. Quando sono necessari misura o calcolo dei
  livelli e quando no? Qual è la differenza tra VLE (effetti sanitari e sensoriali) e VA (inferiori e superiori) e dove
  li trovo? Come gestisco i lavoratori portatori di pacemaker e le lavoratrici in gravidanza? Quali misure adotto se i
  valori di azione sono superati e come funziona la sorveglianza sanitaria? Cita gli articoli e l'Allegato XXXVI.
