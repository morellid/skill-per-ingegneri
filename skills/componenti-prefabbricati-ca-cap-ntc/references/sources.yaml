# Fonte normativa per la qualificazione, il controllo di produzione e
# l'accettazione dei componenti prefabbricati in c.a. e c.a.p. (generalita' e
# metodi di dichiarazione, requisiti degli stabilimenti, controllo di produzione
# e sui materiali di serie, procedure di qualificazione serie dichiarata/
# controllata, marchiatura e documenti di accompagnamento) secondo le NTC 2018
# (DM 17/01/2018), par. 11.8 (Cap. 11). La skill inquadra qualificazione e
# accettazione; non esegue il progetto ne' le verifiche degli elementi.

