display_name: "Prefabbricati c.a./c.a.p.: qualificazione e accettazione (NTC 2018 par. 11.8)"
short_description: Supporto documentale al progettista strutturale, al Direttore dei Lavori e ai produttori per la qualificazione, il controllo di produzione e l'accettazione dei componenti prefabbricati in c.a. e c.a.p. secondo le NTC 2018 (D.M. 17 gennaio 2018), paragrafo 11.8. Aiuta a inquadrare le generalita' del par. 11.8.1 (processo industrializzato e sistema permanente di controllo della produzione in stabilimento; per gli elementi qualificati ai punti A o C del par. 11.1 i requisiti procedurali del deposito ex art. 58 del DPR 380/2001 si considerano assolti; Metodi 1, 2 e 3 per la dichiarazione delle prestazioni); i requisiti degli stabilimenti del par. 11.8.2 (dosaggio a peso, sistema di controllo documentato); il controllo di produzione del par. 11.8.3 (sistema di qualita' UNI EN ISO 9001; per il calcestruzzo controllo continuo secondo il par. 11.2 con apparecchiature tarate annualmente, registri conservati dieci anni, prove a 28 giorni, controllo di tipo B in stabilimento e di tipo A su 3 prelievi con almeno un prelievo ogni cinque giorni; per l'acciaio prova di piegatura su 3 campioni ogni 90 tonnellate e almeno una volta al mese, trazione su 3 campioni ogni 10 rotoli; marchiatura fissa e, per manufatti di peso oltre 8 kN, indicazione del peso; controlli applicabili solo ai prodotti privi di marcatura CE); le procedure di qualificazione del par. 11.8.4 (Servizio Tecnico Centrale; serie dichiarata con attestato quinquennale, serie controllata con Certificato di Valutazione Tecnica quinquennale e prove a rottura su prototipo); e i documenti di accompagnamento del par. 11.8.5 (il Direttore dei Lavori rifiuta le forniture non conformi; certificato di origine, istruzioni di montaggio, verifica della marchiatura). NON esegue il progetto degli elementi prefabbricati ne' le verifiche (par. 4.1.10) e non sostituisce il progettista ne' il Direttore dei Lavori. E' distinta dalla skill sul progetto del calcestruzzo (par. 4.1) e da quella sull'accettazione generale di cls/acciaio (par. 11.2/11.3).
default_prompt: |
  Devo qualificare una serie di elementi prefabbricati in c.a. e gestirne l'accettazione in cantiere secondo le
  NTC 2018 (par. 11.8). Quali metodi di dichiarazione (1/2/3) si applicano e cosa comporta la qualificazione dello
  stabilimento presso il Servizio Tecnico Centrale? Che differenza c'e' tra serie dichiarata (attestato
  quinquennale) e serie controllata (Certificato di Valutazione Tecnica + prove a rottura su prototipo)? Come
  imposto il controllo di produzione su calcestruzzo (controllo tipo A/B, registri) e acciaio (piegatura 3/90 t,
  trazione 3/10 rotoli)? Quali documenti deve verificare il Direttore dei Lavori (certificato d'origine,
  marchiatura > 8 kN)? Cita i paragrafi.
