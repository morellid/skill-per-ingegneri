display_name: "Ancoranti, tiranti e appoggi: qualificazione (NTC 2018 par. 11.4-11.6)"
short_description: Supporto documentale al progettista strutturale e al Direttore dei Lavori per la qualificazione e i controlli di accettazione in cantiere di ancoranti per uso strutturale, giunti di dilatazione stradale, sistemi di precompressione a cavi post-tesi, tiranti di ancoraggio per uso geotecnico e appoggi strutturali secondo le NTC 2018 (D.M. 17 gennaio 2018), paragrafi 11.4, 11.5 e 11.6. Aiuta a inquadrare gli ancoranti per uso strutturale del par. 11.4.1 (qualificazione secondo il punto C del par. 11.1 sulla base della Linea guida ETAG 001, valida anche per le prove di accettazione; in presenza di azioni sismiche, per tutte le classi d'uso del punto 2.4.2, la categoria di prestazione minima da soddisfare e' la C2 dell'Annesso E dell'ETAG 001); i giunti di dilatazione stradale del par. 11.4.2 (punto C del par. 11.1, Linea guida ETAG 032); i sistemi di precompressione a cavi post-tesi del par. 11.5.1 (punto C del par. 11.1, qualificazione mediante Certificato di valutazione tecnica su Linea Guida del Consiglio Superiore dei Lavori Pubblici, fornitura con copia del certificato o marcatura CE su ETA e manuale, verifica e prove di accettazione del Direttore dei Lavori secondo ETAG 013); i tiranti di ancoraggio per uso geotecnico attivi e passivi del par. 11.5.2 (punto C del par. 11.1, per i tipo attivo Certificazione di valutazione tecnica su Linea Guida del Consiglio Superiore dei Lavori Pubblici); e gli appoggi strutturali del par. 11.6 (punto A del par. 11.1, conformita' alla serie UNI EN 1337 e Marcatura CE, Sistema di Valutazione e Verifica della Costanza della Prestazione 1 per applicazioni critiche; altrimenti caso C del par. 11.1). NON esegue il progetto ne' le verifiche dei prodotti e non sostituisce il progettista ne' il Direttore dei Lavori. E' distinta dalla skill sui tiranti di ancoraggio (par. 6.6, progetto e verifiche geotecniche) e da quella sui dispositivi antisismici (par. 11.9, UNI EN 15129), mentre gli appoggi ordinari del par. 11.6 seguono la serie UNI EN 1337.
default_prompt: |
  Devo qualificare e accettare in cantiere alcuni prodotti strutturali secondo le NTC 2018 (par. 11.4-11.6): degli
  ancoranti (tasselli) per il fissaggio di elementi in zona sismica, e degli appoggi per un ponte. Per gli ancoranti
  quale Linea guida si applica (ETAG 001) e quale categoria di prestazione e' obbligatoria in presenza di azioni
  sismiche (C2)? Per gli appoggi quale norma armonizzata (UNI EN 1337) e quale sistema VVCP? Cosa deve verificare il
  Direttore dei Lavori sulla documentazione e con le prove di accettazione? Cita i paragrafi.
