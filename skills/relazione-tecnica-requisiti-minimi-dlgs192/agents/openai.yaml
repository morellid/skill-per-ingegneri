display_name: "Relazione tecnica requisiti minimi energetici - ex legge 10 (D.Lgs. 192/2005 art. 8)"
short_description: Supporto documentale al progettista e al direttore dei lavori per la relazione tecnica di progetto attestante la rispondenza ai requisiti minimi di contenimento dei consumi energetici (la "relazione ex legge 10"), ai sensi del D.Lgs. 19 agosto 2005, n. 192, art. 8 (con le sanzioni dell'art. 15). Inquadra chi la redige - i progettisti nelle rispettive competenze, inserendo calcoli e verifiche - e come si deposita in doppia copia con la DIA/domanda di titolo abilitativo (art. 8 c. 1), le esclusioni (pompa di calore fino a 15 kW; sostituzione generatore sotto la soglia del DM 37/2008), la valutazione dei sistemi alternativi ad alta efficienza per nuove costruzioni e ristrutturazioni importanti (c. 1-bis), l'asseverazione di conformità e l'attestato di qualificazione energetica che il direttore dei lavori presenta con la fine lavori, pena l'inefficacia della dichiarazione (c. 2), la conservazione e i controlli/ispezioni del Comune in corso d'opera o entro 5 anni (cc. 3-5), il regime di dichiarazione sostitutiva di atto notorio (art. 15 c. 1) e le sanzioni al professionista (700-4200 euro, c. 3) e al direttore dei lavori (1000-6000 euro, c. 4). Copre inoltre gli obblighi di integrazione delle fonti rinnovabili negli edifici dell'Allegato III del D.Lgs. 199/2021 come modificato dal D.Lgs. 9 gennaio 2026, n. 5 (RED III), le cui verifiche vanno inserite proprio in questa relazione: quote di copertura FER per nuova costruzione (60%), ristrutturazione importante di primo livello (40%), di secondo livello (15%) e ristrutturazione dell'impianto termico (15%), maggiorazione di 5 punti per gli edifici pubblici, divieto di effetto Joule salvo classe B o superiore, potenza elettrica FER minima, esonero per teleriscaldamento efficiente, motivazione dell'impossibilità tecnica o della non convenienza economica dentro la relazione (o comunicazione al Comune se la relazione non è dovuta) e trasmissione di copia al GSE. NON redige la relazione né esegue i calcoli/verifiche (DM 26/6/2015), non riproduce gli schemi del decreto MiSE, non qualifica l'intervento come ristrutturazione importante di primo o secondo livello (definizioni nel DM 26/6/2015 come modificato dal DM MASE 28/10/2025), non copre l'APE (art. 6) e non sostituisce il progettista o il direttore dei lavori.
default_prompt: |
  Sto progettando/dirigendo un intervento edilizio: come inquadro la relazione tecnica "ex legge 10"
  secondo il D.Lgs. 192/2005? È dovuta nel mio caso, chi la firma e dove/quando si deposita, cosa
  deve contenere per una nuova costruzione (sistemi alternativi), quali obblighi di integrazione
  delle fonti rinnovabili scattano secondo l'Allegato III del D.Lgs. 199/2021 modificato dal D.Lgs.
  5/2026, cosa devo asseverare a fine lavori e quali sanzioni rischio io o il direttore dei lavori?
  Cita gli articoli.
