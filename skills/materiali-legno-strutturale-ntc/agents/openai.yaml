display_name: "Legno strutturale: qualificazione materiali e proprieta' (NTC 2018 par. 11.7)"
short_description: Supporto documentale al progettista strutturale e al Direttore dei Lavori per la qualificazione e le proprieta' dei materiali e prodotti a base di legno per uso strutturale secondo le NTC 2018 (D.M. 17 gennaio 2018), paragrafo 11.7. Aiuta a inquadrare le generalita' del par. 11.7.1 (qualificazione secondo il par. 11.1 nei casi A marcatura CE, B qualificazione, C Linee Guida del Consiglio Superiore dei Lavori Pubblici; sistema di qualita' e rintracciabilita'; il Direttore dei Lavori rifiuta le forniture non conformi ed effettua i controlli di accettazione; laboratori art. 59 del DPR 380/2001 o notificati); le proprieta' dei materiali del par. 11.7.1.1 (valori caratteristici come frattile 5 per cento, prove di durata 300 secondi a 20 gradi e umidita' relativa 65 per cento; profilo resistente Tab. 11.7.I; coefficiente kh per il legno massiccio pari a min tra (150/h) elevato a 0,2 e 1,3, e per il legno lamellare min tra (600/h) elevato a 0,1 e 1,1); e i tipi di prodotto dei par. 11.7.2-11.7.6 (legno massiccio UNI EN 14081-1 con classi UNI EN 338; giunti a dita; legno lamellare incollato UNI EN 14080, con classi delle tavole superiori a C30 solo per classificazione a macchina; pannelli a base di legno UNI EN 13986) con l'accettazione in cantiere del par. 11.7.10. NON esegue le verifiche di progetto (fd = kmod fk/gamma_M) e non sostituisce il progettista ne' il Direttore dei Lavori. E' distinta dalla skill sul progetto del legno (par. 4.4), da quella sul legno sismico (par. 7.7) e dalle skill materiali su muratura (par. 11.10) e cls/acciaio (par. 11.2/11.3).
default_prompt: |
  Devo qualificare i prodotti in legno strutturale per un progetto secondo le NTC 2018 (par. 11.7). Quali casi di
  qualificazione (A/B/C) si applicano e chi fa i controlli di accettazione in cantiere? Cosa deve contenere il
  profilo resistente (Tab. 11.7.I) e come applico il coefficiente kh per il legno massiccio (150 mm) e lamellare
  (600 mm)? Quali norme CE valgono per massiccio, lamellare e pannelli (UNI EN 14081-1/14080/13986)? Cita i paragrafi.
