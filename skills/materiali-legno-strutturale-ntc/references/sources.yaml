# Fonte normativa per la qualificazione e le proprieta' dei materiali e prodotti
# a base di legno per uso strutturale (generalita' e casi di qualificazione,
# valori caratteristici e profilo resistente, coefficiente kh, tipi di prodotto
# e norme di riferimento, accettazione in cantiere) secondo le NTC 2018 (DM
# 17/01/2018), par. 11.7 (Cap. 11 «Materiali e prodotti per uso strutturale»).
# La skill inquadra la qualificazione e le proprieta'; non esegue le verifiche di
# progetto (fd = kmod fk/gamma_M).

