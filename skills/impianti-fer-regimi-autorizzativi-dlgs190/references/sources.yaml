    license: public-domain
    binary_path: not_in_repo/dm-mase-223-2026.pdf
    md_path: references/fonti/dm-mase-223-2026.md
    excerpt_path: references/estratti/modello-unico-parte-iii-suer.md
    notes: |
      PDF firmato digitalmente sul sito istituzionale MASE, protocollo
      m_amte.MASE.UDCM DECRETI MINISTRO.R.0000223.15-07-2026 (303411 byte, 5 pagine, colonna
      singola: estrazione con pdftotext -layout). Adottato previa intesa in Conferenza unificata,
      Repertorio atti n. 81/CU, seduta del 7 luglio 2026. Trascrizione integrale (premesse,
      artt. 1-3, sottoscrizione) nel md_path.
      LIMITE DI RESA (1): l'Allegato 1, cioe' il modulo "Modello Unico Parte III" con i campi da
      compilare, NON e' contenuto nel PDF, che si chiude con la firma del Ministro. I campi del
      modulo non sono noti da questa fonte.
      LIMITE DI RESA (2): il decreto entra in vigore il giorno successivo alla pubblicazione sul
      sito MASE (art. 3 c. 1) e quella data non compare nel PDF. Non sono quindi determinabili da
      questa fonte la data di entrata in vigore, il termine di 15 giorni dell'art. 1 c. 2
      (disponibilita' del modello su SUER) ne' i sei mesi dell'art. 1 c. 4, che decorrono dalla
      stessa data.
      Il DM 2 agosto 2022, n. 297 (Modello Unico Parte I e II) e il DM 11 dicembre 2025, n. 441
      (Modelli Unici PAS e AU) sono citati ma non scaricati: fuori scope v0.1.
