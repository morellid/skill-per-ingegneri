    notes: |
      Codice redazionale 24G00205 (GU Serie generale n. 291 del 12/12/2024). Indice Normattiva
      pinnato a !vig=2026-08-09 (hash verificato riproducibile con il metodo di
      scripts/fetch-sources.sh). Articoli e allegati recuperati singolarmente via caricaArticolo
      nella stessa sessione e trascritti verbatim nel md_path.
      TESTO CONSOLIDATO, non originario: il decreto e' stato novellato in particolare dal D.Lgs.
      26 novembre 2025, n. 178. Versioni trascritte (con "Testo in vigore dal"): art. 1 v.2
      (11-12-2025), art. 5 v.3 (21-1-2026), art. 6 v.2 (11-12-2025), art. 7 v.3 (11-12-2025),
      art. 8 v.4 (19-4-2026), art. 9 v.4 (11-12-2025), Allegato A v.4, Allegato B v.5, Allegato C
      v.4 (tutti 21-2-2026).
      LIMITE DI RESA: non sono trascritti gli artt. 2, 3, 4, 10, 11, 11-bis, 12, 13 e seguenti,
      ne' l'Allegato D (norme abrogate). L'Allegato C-bis (ripartizione regionale di potenza
      minima) e' consultato ma non riprodotto: la Tabella 1 e' "Parte di provvedimento in formato
      grafico" e non e' estraibile dal testo.

