display_name: "Fascicolo dell'opera (D.Lgs 81/2008 art. 91 + Allegato XVI)"
short_description: Supporto documentale al coordinatore per la sicurezza in fase di progettazione (CSP), al CSE e al committente per la predisposizione, l'aggiornamento e la verifica di completezza del Fascicolo con le caratteristiche dell'opera secondo il D.Lgs 81/2008, art. 91 comma 1 lettera b) e Allegato XVI. Aiuta a inquadrare la titolarita' e il ciclo di vita del fascicolo (predisposto la prima volta dal CSP, modificato in fase esecutiva dal CSE ex art. 92, aggiornato dal committente a seguito delle modifiche nella vita dell'opera; accompagna l'opera per tutta la sua durata; non e' predisposto per i lavori di manutenzione ordinaria ex art. 3 comma 1 lettera a del DPR 380); la struttura in tre capitoli (Capitolo I descrizione sintetica dell'opera e soggetti coinvolti, scheda I; Capitolo II individuazione dei rischi e delle misure preventive e protettive in dotazione dell'opera e ausiliarie per gli interventi successivi prevedibili come le manutenzioni ordinarie e straordinarie, schede II-1, II-2 e II-3; Capitolo III riferimenti alla documentazione di supporto esistente, schede III-1, III-2 e III-3); la distinzione tra misure in dotazione dell'opera (incorporate o a servizio dell'opera, come linee vita, ganci, parapetti permanenti) e misure ausiliarie (richieste ai datori di lavoro e ai lavoratori autonomi dei lavori successivi, come ponteggi, trabattelli, DPI anticaduta); i sette elementi da considerare (accessi ai luoghi di lavoro; sicurezza dei luoghi di lavoro; impianti di alimentazione e scarico; approvvigionamento e movimentazione materiali; approvvigionamento e movimentazione attrezzature; igiene sul lavoro; interferenze e protezione dei terzi); e le informazioni per utilizzare le misure in sicurezza e mantenerle nel tempo (verifiche, interventi manutentivi e periodicita', scheda II-3). NON redige il fascicolo al posto del coordinatore ne' progetta le misure concrete (linee vita, ganci) e non sostituisce il coordinatore. E' distinta dalle skill sul PSC (art. 100 + Allegato XV), sul POS (Allegato XV punto 3.2) e sui ruoli dei coordinatori (artt. 89-92).
default_prompt: |
  Devo predisporre/verificare il Fascicolo con le caratteristiche dell'opera per un edificio secondo il D.Lgs 81/2008
  (art. 91 e Allegato XVI). Chi lo predispone e chi lo aggiorna, e quando non è richiesto? Com'è strutturato (i tre
  capitoli e le schede I, II-1/2/3, III)? Qual è la differenza tra misure preventive e protettive in dotazione
  dell'opera (linee vita, ganci) e misure ausiliarie? Quali sono i sette elementi da considerare e cosa deve contenere
  la scheda II-3 sulla manutenzione delle misure? Cita gli articoli e l'Allegato XVI.
