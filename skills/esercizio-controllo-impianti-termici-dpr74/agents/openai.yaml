display_name: Esercizio, controllo e manutenzione degli impianti termici (DPR 74/2013)
short_description: Supporto documentale ai criteri di esercizio, conduzione, controllo e manutenzione degli impianti termici per la climatizzazione invernale ed estiva, secondo il D.P.R. 16 aprile 2013, n. 74 (attuativo del D.Lgs. 192/2005). Aiuta a rispettare i valori massimi di temperatura (18 C +2 industriale, 20 C +2 altri edifici in inverno; non meno di 26 C -2 in estate - art. 3), i limiti di esercizio per zona climatica A-F con periodi e orari e le deroghe comunali (artt. 4-5), a individuare responsabile e terzo responsabile dell'impianto con i limiti alla delega (art. 6), a impostare controllo e manutenzione da ditte abilitate (DM 37/2008 - art. 7) e il controllo di efficienza energetica con rapporto RCEE per impianti invernali oltre 10 kW ed estivi oltre 12 kW (art. 8), e a tenere il libretto di impianto (DM 10/2/2014). Avverte inoltre che, dal D.Lgs. 9 gennaio 2026, n. 5 (RED III), un intervento di ristrutturazione dell'impianto termico rientra nel campo di applicazione dell'Allegato III del D.Lgs. 199/2021 e puo' far scattare un obbligo di copertura da fonti rinnovabili pari al 15% della somma dei consumi per climatizzazione invernale ed estiva, da verificare a monte dell'intervento. NON riproduce i modelli RCEE (Allegato A) ne' il libretto, non esegue il controllo/manutenzione, non redige il RCEE, non tratta gli obblighi FER (rinvio alla skill relazione-tecnica-requisiti-minimi-dlgs192) e non sostituisce il manutentore abilitato ne' la disciplina regionale.
default_prompt: |
  Per il mio impianto termico (climatizzazione): quali temperature massime e quali periodi/orari
  di accensione devo rispettare secondo il DPR 74/2013 nella mia zona climatica? Chi e' il
  responsabile e posso nominare un terzo responsabile? Quando serve il controllo di efficienza
  energetica (RCEE)? Se devo sostituire il generatore, scatta anche una verifica sugli obblighi di
  integrazione delle fonti rinnovabili? Cita gli articoli.
