schema_version: 1
skill: esercizio-controllo-impianti-termici-dpr74
last_verified: 2026-08-09

# Fonte per i criteri di esercizio, conduzione, controllo e manutenzione degli impianti
# termici per la climatizzazione: valori massimi di temperatura, periodi e orari di esercizio
# per zona climatica, responsabile e terzo responsabile dell'impianto, controllo e
# manutenzione, controllo di efficienza energetica (RCEE). Il D.P.R. 74/2013 e' attuativo
# dell'art. 4, comma 1, lettera c) del D.Lgs. 192/2005.

sources:
  - id: dpr-74-2013
    title: "D.P.R. 16 aprile 2013, n. 74 - Regolamento su esercizio, conduzione, controllo, manutenzione e ispezione degli impianti termici per la climatizzazione (testo vigente al 2026-07-16)"
    type: decreto-presidente-repubblica
    url: https://www.normattiva.it/uri-res/N2Ls?urn:nir:stato:decreto.presidente.repubblica:2013-04-16;74!vig=2026-07-16
    accessed: 2026-07-16
    sha256: 13aa0ad0fb0edbe235455d2b79f2173ec2dc3dff8c28abc5b606e9d4cb8e32f5
    license: public-domain
    binary_path: not_in_repo/dpr74-2013-vig.html
    md_path: references/fonti/dpr-74-2013.md
    excerpt_path: references/estratti/impianti-termici-checklist.md
    notes: |
      Codice redazionale 13G00114 (GU n. 149 del 27/6/2013). Indice Normattiva pinnato a
      !vig=2026-07-16 (hash stabile, doppio download: 13aa0ad0...). Articoli via caricaArticolo,
      trascritti verbatim: art. 3 (valori massimi di temperatura ambiente: 18C+2 industriale /
      20C+2 altri edifici; estiva >= 26C-2), art. 4 (limiti di esercizio: periodi e ore
      giornaliere per zona climatica A-F), art. 5 (ordinanze del sindaco in deroga), art. 6
      (responsabile dell'impianto e terzo responsabile: delega e limiti), art. 7 (controllo e
      manutenzione da ditte abilitate DM 37/2008, con la periodicita' delle istruzioni
      dell'installatore/fabbricante), art. 8 (controllo di efficienza energetica per impianti
      invernali > 10 kW ed estivi > 12 kW, con rapporto di controllo di efficienza energetica -
      RCEE - Allegato A; casi: prima messa in esercizio, sostituzione del generatore, ecc.).
      LIMITE DI RESA: l'Allegato A (modelli RCEE) e' costituito da moduli in formato
      tabellare/grafico: i campi puntuali dei modelli NON sono riprodotti e vanno letti
      sull'atto. Il modello di LIBRETTO DI IMPIANTO e i modelli RCEE aggiornati sono nel DM
      attuativo 10 febbraio 2014 (citato, non riprodotto). La skill copre il quadro e i criteri,
      non i campi dei moduli.

  - id: dlgs-5-2026-allegato-iii-estratto
    title: "D.Lgs. 9 gennaio 2026, n. 5 (attuazione direttiva UE 2023/2413 - RED III) - art. 29, parti dell'Allegato III del D.Lgs. 199/2021 rilevanti per gli interventi sull'impianto termico (GU Serie generale n. 15 del 20 gennaio 2026)"
    type: decreto-legislativo
    # PDF del fascicolo integrale di Gazzetta Ufficiale: e' l'unica forma di URL PDF servita da
    # gazzettaufficiale.it (la forma /eli/id/.../sg/pdf a livello di singolo atto risponde 404).
    url: https://www.gazzettaufficiale.it/eli/gu/2026/01/20/15/sg/pdf
    accessed: 2026-08-09
    sha256: 3d13cb9afa45d5c3f9c737e892f30af5ba7df08733bb891a9f51dd534d73c3a1
    license: public-domain
    binary_path: not_in_repo/gu-sg-15-2026.pdf
    md_path: references/fonti/dlgs-5-2026-allegato-iii-estratto.md
    excerpt_path: references/estratti/impianti-termici-checklist.md
    notes: |
      Codice redazionale 26G00018, 121 pagine PDF, hash stabile su doppio download (3d13cb9a...).
      Estrazione con pdftotext SENZA -layout per il corpo dell'atto (due colonne) e CON -layout per
      le pagine "Note" (colonna singola). La forma di URL /eli/id/.../sg/pdf a livello di singolo
      atto risponde 404.
      Fonte AGGIUNTA IN v0.2.0-alpha con scopo deliberatamente RISTRETTO: di questo decreto rilevano
      qui solo le disposizioni che fanno scattare una verifica sulle fonti rinnovabili in occasione
      di un intervento sull'impianto termico. Trascritti verbatim in
      references/fonti/dlgs-5-2026-allegato-iii-estratto.md: art. 29 c. 1 lett. b) punto 2 (nuovo
      campo di applicazione dell'Allegato III, che include ora gli "edifici esistenti oggetto di
      interventi di ristrutturazione dell'impianto termico" - pag. GU 21); art. 29 c. 1 lett. c)
      punto 2 lett. d) (copertura del 15% della somma dei consumi per climatizzazione invernale ed
      estiva - pag. GU 21); Sezione D punto 1 dell'Allegato III risultante, dalle "Note all'art. 29"
      (motivazione della deroga nella relazione ex art. 8 c. 1 del D.Lgs. 192/2005, e comunicazione
      al Comune quando quella relazione non e' dovuta - pag. GU 55).
      DECORRENZA: il decreto non contiene un articolo di entrata in vigore (l'ultimo e' l'art. 51,
      clausola di invarianza finanziaria). La data risultante non e' nel PDF: e' presa dalla scheda
      Normattiva registrata come fonte dlgs-5-2026-entrata-in-vigore, che dichiara "Entrata in vigore
      del provvedimento: 04/02/2026"; 180 giorni dopo cade il 3 agosto 2026. La
      formula "decorsi centottanta giorni dall'entrata in vigore del presente decreto" e' pero'
      testualmente ambigua perche' inserita dentro l'Allegato III del D.Lgs. 199/2021: l'ambiguita'
      e' segnalata, non risolta d'ufficio.
      LIMITE DI RESA: questa skill NON tratta gli obblighi FER, non calcola le quote di copertura e
      non qualifica l'intervento ai sensi del DM 26/6/2015 come modificato dal DM MASE 28/10/2025.
      Si limita ad AVVERTIRE che un intervento sull'impianto termico puo' ora far scattare la
      verifica dell'Allegato III, e a rinviare alla skill
      relazione-tecnica-requisiti-minimi-dlgs192, che trascrive l'art. 29 per intero e l'Allegato III
      risultante in tutte le Sezioni A-E.

